name: Coletar notícias automaticamente

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: coletor
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências do coletor
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Rodar o coletor de notícias
        working-directory: scripts
        run: node aggregate.js

      - name: Publicar novo docs/data/news.json (se mudou)
        run: |
          git config user.name "trem-de-noticias-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/news.json
          if git diff --staged --quiet; then
            echo "Sem novidades."
          else
            git commit -m "chore: atualizar notícias automaticamente"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Manter o agendamento ativo
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/aggregate.yml/enable"
